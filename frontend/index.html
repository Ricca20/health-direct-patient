<!doctype html>
<html lang="en">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Description -->
    <title>Patient Portal | SOPHOS</title>
    <meta
      name="description"
      content="Secure patient portal for SOPHOS. Manage appointments, medical history, early detection programs, and communicate with your doctors."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#0f766e" />

    <!-- Canonical -->
    <link rel="canonical" href="https://patient.health-direct.ru/" />

    <!-- Robots (prevent search engines from indexing private portal) -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Open Graph (useful if someone accidentally shares the link) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Patient Portal | SOPHOS" />
    <meta
      property="og:description"
      content="Log in securely to manage your healthcare with SOPHOS."
    />
    <meta property="og:image" content="/favicon.png" />
    <meta property="og:url" content="https://patient.health-direct.ru/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Patient Portal | SOPHOS" />
    <meta
      name="twitter:description"
      content="Secure portal for managing appointments and healthcare records."
    />
    <meta name="twitter:image" content="/favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
